# flutter_native_splash configuration with custom light gray color and logo
flutter_native_splash:
  # Match logo's light background
  color: "f5f5f7"  # Very light gray/off-white to match logo
  color_dark: "f5f5f7"  # Same for dark mode
  
  # XFINI logo centered on light gray background
  image: assets/images/logo/app_logo.png
  
  # Platform settings
  android: true
  ios: true
  web: false